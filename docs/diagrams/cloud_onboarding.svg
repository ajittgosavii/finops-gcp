   </g>
   <g id="text_29">
    <text style="font-size: 5.4px; font-family: 'DejaVu Sans'; fill: #7a8599" transform="translate(148.367953 390.763921)">Another AWS organization, another Azure tenant or billing account,</text>
    <text style="font-size: 5.4px; font-family: 'DejaVu Sans'; fill: #7a8599" transform="translate(200.835281 397.631371)">another GCP billing account.</text>
   </g>
   <g id="text_30">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b142a" x="667.872" y="376.416845" transform="rotate(-0 667.872 376.416845)">A regulated utility has several</text>
   </g>
   <g id="text_31">
    <text style="font-size: 5.4px; font-family: 'DejaVu Sans'; fill: #7a8599" transform="translate(593.419922 390.763921)">Regulated and unregulated entities cannot share a bill.</text>
    <text style="font-size: 5.4px; font-family: 'DejaVu Sans'; fill: #7a8599" transform="translate(583.755609 397.631371)">Declare each as a binding; BillingAccountId keeps them apart.</text>
   </g>
