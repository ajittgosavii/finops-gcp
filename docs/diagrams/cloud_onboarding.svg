   <g id="text_9">
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #445066" x="42.912" y="441.951895" transform="rotate(-0 42.912 441.951895)">—  AWS and Azure are reached through Workload Identity Federation, so no static access key is ever stored.</text>
   </g>
   <g id="text_10">
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #445066" x="42.912" y="465.014935" transform="rotate(-0 42.912 465.014935)">—  Prefer a FOCUS export over Cost Explorer: Cost Explorer has no list price, so Effective Savings Rate comes out understated.</text>
   </g>
   <g id="text_11">
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #445066" x="42.912" y="488.077975" transform="rotate(-0 42.912 488.077975)">—  A binding that fails contributes zero rows and a reason. The page still renders the clouds that are wired.</text>
   </g>
   <g id="text_12">
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #7a8599" x="25.056" y="521.342985" transform="rotate(-0 25.056 521.342985)">Bindings are pulled independently and concatenated into one FOCUS frame.</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #c9851f" x="62.5536" y="173.036766" transform="rotate(-0 62.5536 173.036766)">AWS</text>
   </g>
   <g id="text_14">
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #445066" transform="translate(144.6912 167.538276)">Cost Explorer / Data Exports at the</text>
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #445066" transform="translate(144.6912 176.934819)">PAYER (management) account</text>
   </g>
   <g id="text_15">
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #445066" transform="translate(350.0352 167.538276)">Every linked account,</text>
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #445066" transform="translate(350.0352 176.934819)">as SubAccountId</text>
   </g>
   <g id="text_16">
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #445066" transform="translate(546.4512 167.388229)">FOCUS_1_2_AWS</text>
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #445066" transform="translate(546.4512 176.968335)">Data Export -&gt; S3</text>
   </g>
   <g id="text_17">
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #445066" x="725.0112" y="172.236547" transform="rotate(-0 725.0112 172.236547)">One per AWS organization</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1e6fd9" x="62.5536" y="238.677726" transform="rotate(-0 62.5536 238.677726)">Azure</text>
   </g>
   <g id="text_19">
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #445066" transform="translate(144.6912 233.179236)">Cost Management at</text>
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #445066" transform="translate(144.6912 242.575779)">BILLING-ACCOUNT scope</text>
   </g>
   <g id="text_20">
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #445066" transform="translate(350.0352 233.179236)">Every subscription beneath it,</text>
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #445066" transform="translate(350.0352 242.575779)">as SubAccountId</text>
   </g>
   <g id="text_21">
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #445066" transform="translate(546.4512 233.179236)">FocusCost export</text>
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #445066" transform="translate(546.4512 242.575779)">-&gt; Blob Storage</text>
   </g>
   <g id="text_22">
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #445066" x="725.0112" y="237.877507" transform="rotate(-0 725.0112 237.877507)">One per tenant</text>
   </g>
   <g id="text_23">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0c7a3e" x="62.5536" y="304.281577" transform="rotate(-0 62.5536 304.281577)">Google Cloud</text>
   </g>
   <g id="text_24">
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #445066" transform="translate(144.6912 298.820196)">BigQuery billing export,</text>
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #445066" transform="translate(144.6912 308.216739)">Detailed + Pricing enabled</text>
   </g>
   <g id="text_25">
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #445066" transform="translate(350.0352 298.820196)">Every project the account pays for,</text>
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #445066" transform="translate(350.0352 308.216739)">as SubAccountId</text>
   </g>
   <g id="text_26">
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #445066" transform="translate(546.4512 298.728414)">gcp_billing_export_focus_*</text>
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #445066" transform="translate(546.4512 308.308521)">native, no copy</text>
   </g>
   <g id="text_27">
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #445066" x="725.0112" y="303.518467" transform="rotate(-0 725.0112 303.518467)">One per billing account</text>
   </g>
