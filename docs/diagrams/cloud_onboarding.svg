   <g id="text_9">
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #445066" x="42.912" y="437.239747" transform="rotate(-0 42.912 437.239747)">—  AWS and Azure federate through Workload Identity, so no static key is stored. OCI signs with an RSA key -- the one credential that must be rotated.</text>
   </g>
   <g id="text_10">
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #445066" x="42.912" y="457.641667" transform="rotate(-0 42.912 457.641667)">—  OCI's report bucket lives in Oracle's own tenancy: tenancy admin is not enough, you must 'endorse' your group into it.</text>
   </g>
   <g id="text_11">
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #445066" x="42.912" y="478.043587" transform="rotate(-0 42.912 478.043587)">—  Prefer a FOCUS export over Cost Explorer: Cost Explorer has no list price, so Effective Savings Rate comes out understated.</text>
   </g>
   <g id="text_12">
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #445066" x="42.912" y="498.445507" transform="rotate(-0 42.912 498.445507)">—  A binding that fails contributes zero rows and a reason. The page still renders the clouds that are wired.</text>
   </g>
   <g id="text_13">
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #7a8599" x="25.056" y="521.342985" transform="rotate(-0 25.056 521.342985)">Bindings are pulled independently and concatenated into one FOCUS frame.</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #c9851f" x="62.5536" y="169.045086" transform="rotate(-0 62.5536 169.045086)">AWS</text>
   </g>
   <g id="text_15">
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #445066" transform="translate(144.6912 163.546596)">Cost Explorer / Data Exports at the</text>
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #445066" transform="translate(144.6912 172.943139)">PAYER (management) account</text>
   </g>
   <g id="text_16">
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #445066" transform="translate(350.0352 163.546596)">Every linked account,</text>
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #445066" transform="translate(350.0352 172.943139)">as SubAccountId</text>
   </g>
   <g id="text_17">
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #445066" transform="translate(546.4512 163.396549)">FOCUS_1_2_AWS</text>
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #445066" transform="translate(546.4512 172.976655)">Data Export -&gt; S3</text>
   </g>
   <g id="text_18">
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #445066" x="725.0112" y="168.244867" transform="rotate(-0 725.0112 168.244867)">One per AWS organization</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1e6fd9" x="62.5536" y="225.372126" transform="rotate(-0 62.5536 225.372126)">Azure</text>
   </g>
   <g id="text_20">
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #445066" transform="translate(144.6912 219.873636)">Cost Management at</text>
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #445066" transform="translate(144.6912 229.270179)">BILLING-ACCOUNT scope</text>
   </g>
   <g id="text_21">
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #445066" transform="translate(350.0352 219.873636)">Every subscription beneath it,</text>
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #445066" transform="translate(350.0352 229.270179)">as SubAccountId</text>
   </g>
   <g id="text_22">
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #445066" transform="translate(546.4512 219.873636)">FocusCost export</text>
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #445066" transform="translate(546.4512 229.270179)">-&gt; Blob Storage</text>
   </g>
   <g id="text_23">
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #445066" x="725.0112" y="224.571907" transform="rotate(-0 725.0112 224.571907)">One per tenant</text>
   </g>
   <g id="text_24">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0c7a3e" x="62.5536" y="281.662057" transform="rotate(-0 62.5536 281.662057)">Google Cloud</text>
   </g>
   <g id="text_25">
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #445066" transform="translate(144.6912 276.200676)">BigQuery billing export,</text>
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #445066" transform="translate(144.6912 285.597219)">Detailed + Pricing enabled</text>
   </g>
   <g id="text_26">
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #445066" transform="translate(350.0352 276.200676)">Every project the account pays for,</text>
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #445066" transform="translate(350.0352 285.597219)">as SubAccountId</text>
   </g>
   <g id="text_27">
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #445066" transform="translate(546.4512 276.108894)">gcp_billing_export_focus_*</text>
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #445066" transform="translate(546.4512 285.689001)">native, no copy</text>
   </g>
   <g id="text_28">
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #445066" x="725.0112" y="280.898947" transform="rotate(-0 725.0112 280.898947)">One per billing account</text>
   </g>
   <g id="text_29">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6e3aa7" x="62.5536" y="338.026206" transform="rotate(-0 62.5536 338.026206)">OCI</text>
   </g>
   <g id="text_30">
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #445066" transform="translate(144.6912 332.527716)">API signing key for a user in the</text>
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #445066" transform="translate(144.6912 341.924259)">TENANCY; endorse policy required</text>
   </g>
   <g id="text_31">
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #445066" transform="translate(350.0352 332.527716)">Every compartment beneath it,</text>
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #445066" transform="translate(350.0352 341.924259)">as SubAccountId</text>
   </g>
   <g id="text_32">
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #445066" transform="translate(546.4512 332.527716)">FOCUS Reports in the</text>
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #445066" transform="translate(546.4512 341.924259)">Oracle-owned 'bling' bucket</text>
   </g>
   <g id="text_33">
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #445066" x="725.0112" y="337.225987" transform="rotate(-0 725.0112 337.225987)">One per tenancy</text>
   </g>
