   <g id="text_34">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b142a" x="239.328" y="394.189676" transform="rotate(-0 239.328 394.189676)">A second credential means a second PAYER</text>
   </g>
   <g id="text_35">
    <text style="font-size: 5.4px; font-family: 'DejaVu Sans'; fill: #7a8599" transform="translate(148.367953 408.504721)">Another AWS organization, another Azure tenant or billing account,</text>
    <text style="font-size: 5.4px; font-family: 'DejaVu Sans'; fill: #7a8599" transform="translate(171.542391 415.372171)">another GCP billing account, another OCI tenancy.</text>
   </g>
   <g id="text_36">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b142a" x="667.872" y="394.157645" transform="rotate(-0 667.872 394.157645)">A regulated utility has several</text>
   </g>
   <g id="text_37">
    <text style="font-size: 5.4px; font-family: 'DejaVu Sans'; fill: #7a8599" transform="translate(593.419922 408.504721)">Regulated and unregulated entities cannot share a bill.</text>
    <text style="font-size: 5.4px; font-family: 'DejaVu Sans'; fill: #7a8599" transform="translate(583.755609 415.372171)">Declare each as a binding; BillingAccountId keeps them apart.</text>
   </g>
  </g>
