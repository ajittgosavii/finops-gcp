   <g id="text_1">
    <text style="font-weight: 700; font-size: 6.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #7a8599" x="25.056" y="30.282554" transform="rotate(-0 25.056 30.282554)">CONNECTING THE FOUR CLOUDS</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b142a" x="25.056" y="56.862486" transform="rotate(-0 25.056 56.862486)">One credential per payer, not one per account</text>
   </g>
   <g id="text_3">
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #445066" x="25.056" y="81.979217" transform="rotate(-0 25.056 81.979217)">That is how the providers aggregate billing. A second credential is only for a second payer.</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 6.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #7a8599" x="46.4832" y="129.658627" transform="rotate(-0 46.4832 129.658627)">Cloud</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 6.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #7a8599" x="144.6912" y="129.658627" transform="rotate(-0 144.6912 129.658627)">Where the credential points</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 6.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #7a8599" x="350.0352" y="129.658627" transform="rotate(-0 350.0352 129.658627)">What one credential covers</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 6.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #7a8599" x="546.4512" y="129.658627" transform="rotate(-0 546.4512 129.658627)">FOCUS source</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 6.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #7a8599" x="725.0112" y="129.607065" transform="rotate(-0 725.0112 129.607065)">How many</text>
   </g>
