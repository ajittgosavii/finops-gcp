# Build and push both images, then ship them to the Cloud Run service and job.
#
# No project id is hardcoded: $PROJECT_ID is injected by Cloud Build, and the
# region / repo / dataset are substitutions with sensible defaults. Terraform
# owns the runtime CONFIGURATION (env, secrets, IAM, scaling); this pipeline only
# ships new IMAGES, so a deploy here never fights the infra state.
#
# Both Dockerfiles expect the repository root as the build context (they COPY
# packages/finops-core alongside their own service dir), so the context is ".".

substitutions:
  _REGION: us-central1
  _REPO: finops

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/finops-api:${SHORT_SHA}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/finops-api:latest"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/finops-ingest:${SHORT_SHA}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/finops-ingest:latest"

steps:
  # ---- build --------------------------------------------------------------
  - id: build-api
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - services/api/Dockerfile
      - -t
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/finops-api:${SHORT_SHA}"
      - -t
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/finops-api:latest"
      - .

  - id: build-ingest
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - services/ingest/Dockerfile
      - -t
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/finops-ingest:${SHORT_SHA}"
      - -t
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/finops-ingest:latest"
      - .

  # ---- push (before deploy so Cloud Run can pull the digest) ---------------
  - id: push-api
    name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/finops-api"]
    waitFor: ["build-api"]

  - id: push-ingest
    name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/finops-ingest"]
    waitFor: ["build-ingest"]

  # ---- deploy -------------------------------------------------------------
  # Image-only updates: every other setting is Terraform-managed and preserved.
  - id: deploy-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - finops-api
      - --region=${_REGION}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/finops-api:${SHORT_SHA}
      - --no-allow-unauthenticated
    waitFor: ["push-api"]

  - id: deploy-ingest
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - finops-ingest
      - --region=${_REGION}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/finops-ingest:${SHORT_SHA}
    waitFor: ["push-ingest"]
